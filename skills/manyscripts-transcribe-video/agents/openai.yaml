interface:
  display_name: "ManyScripts Transcribe Video"
  short_description: "Transcribe public social videos inside ChatGPT"
  default_prompt: "Use $manyscripts-transcribe-video to get the complete transcript from this public video URL."
dependencies:
  tools:
    - type: "mcp"
      value: "manyscripts"
      description: "Extract complete transcripts, creator captions, and metadata from public social videos."
      transport: "streamable_http"
      url: "https://www.manyscripts.com/api/mcp"
policy:
  allow_implicit_invocation: true
